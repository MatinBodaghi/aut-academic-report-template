name: Build LaTeX Document

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile LaTeX with XeLaTeX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeX Live and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-lang-arabic \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-fonts-recommended \
            texlive-pictures \
            fontconfig \
            poppler-utils

      - name: Install Persian and Latin Fonts
        run: |
          mkdir -p ~/.local/share/fonts
          if [ -d "fonts" ]; then
            cp fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
            cp fonts/*.TTF ~/.local/share/fonts/ 2>/dev/null || true
          fi
          fc-cache -fv
          echo "=== Registered Target Fonts ==="
          fc-list : family | grep -E "Nazanin|Titr|Times|Free" || true

      - name: Compile Document
        run: |
          xelatex -interaction=nonstopmode main.tex
          bibtex main || true
          xelatex -interaction=nonstopmode main.tex
          xelatex -interaction=nonstopmode main.tex

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: academic-document-pdf
          path: main.pdf
          if-no-files-found: error
